<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            __TITLE__
        </title>
        <style>
        :root {
        color-scheme: dark;
        }
        html,
        body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        }
        body {
        background: #0b1020;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        }
        #app,
        #topologyCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        }
        #topologyCanvas {
        cursor: grab;
        touch-action: none;
        }
        #topologyCanvas.dragging {
        cursor: grabbing;
        }
        #panel {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        width: 380px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.30);
        border-radius: 16px;
        padding: 18px 18px 16px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(8px);
        }
        #panel h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.15;
        }
        #panel .meta {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
        word-break: break-word;
        }
        #panel .meta .source {
        margin-top: 4px;
        }
        #panel select,
        #panel button {
        background: rgba(15, 23, 42, 0.95);
        color: #f3f4f6;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 6px;
        padding: 4px 9px;
        font: inherit;
        }
        #panel button {
        cursor: pointer;
        }
        #groupControls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 22px;
        }
        #groupControls label,
        .check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        cursor: pointer;
        user-select: none;
        min-width: 0;
        }
        #groupControls input[type="checkbox"],
        .check-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: #3b82f6;
        flex: 0 0 auto;
        }
        .legend-line {
        width: 24px;
        height: 3px;
        border-radius: 999px;
        flex: 0 0 auto;
        box-shadow: 0 0 8px currentColor;
        }
        .legend-text {
        font-size: 14px;
        color: #e5e7eb;
        min-width: 0;
        }
        .legend-name {
        white-space: nowrap;
        }
        #groupControls .count {
        color: #94a3b8;
        font-size: 11px;
        margin-left: 2px;
        }
        .panel-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
        font-size: 15px;
        color: #e5e7eb;
        }
        .panel-row .spacer {
        flex: 1 1 auto;
        }
        .panel-help {
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 14px;
        }
        #speedControls,
        #speedLegend {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.20);
        }
        #speedControls[hidden],
        #speedLegend[hidden] {
        display: none;
        }
        .speed-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
        font-size: 13px;
        color: #cbd5e1;
        }
        .speed-heading .value {
        margin-left: auto;
        color: #f8fafc;
        font-variant-numeric: tabular-nums;
        }
        .dual-range {
        position: relative;
        height: 28px;
        margin: 0 1px;
        }
        .dual-range .track {
        position: absolute;
        left: 0;
        right: 0;
        top: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.30);
        background: linear-gradient(
        90deg,
        #000004 0%,
        #2c115f 18%,
        #721f81 35%,
        #b73779 52%,
        #f1605d 68%,
        #feb078 84%,
        #fcfdbf 100%
        );
        box-shadow: inset 0 0 8px rgba(15, 23, 42, 0.32);
        }
        .dual-range .mask {
        position: absolute;
        top: 10px;
        height: 12px;
        background: rgba(2, 6, 23, 0.72);
        pointer-events: none;
        }
        .dual-range .mask-left {
        left: 0;
        border-radius: 999px 0 0 999px;
        }
        .dual-range .mask-right {
        right: 0;
        border-radius: 0 999px 999px 0;
        }
        .dual-range input[type="range"] {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 28px;
        margin: 0;
        appearance: none;
        background: transparent;
        pointer-events: none;
        }
        .dual-range input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: transparent;
        border: 0;
        }
        .dual-range input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -3px;
        border-radius: 50%;
        border: 2px solid #e2e8f0;
        background: #0f172a;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
        pointer-events: auto;
        cursor: ew-resize;
        }
        .dual-range input[type="range"]::-moz-range-track {
        height: 10px;
        background: transparent;
        border: 0;
        }
        .dual-range input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #e2e8f0;
        background: #0f172a;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
        pointer-events: auto;
        cursor: ew-resize;
        }
        .range-options {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: #cbd5e1;
        font-size: 12px;
        }
        .range-options button {
        margin-left: auto;
        padding: 2px 8px;
        font-size: 12px;
        }
        #speedLegend .legend-title {
        font-size: 13px;
        color: #cbd5e1;
        margin-bottom: 8px;
        }
        #speedLegend .legend-note {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.35;
        }
        .speed-scale {
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.30);
        box-shadow: inset 0 0 8px rgba(15, 23, 42, 0.32);
        }
        .speed-scale-labels {
        position: relative;
        height: 16px;
        margin-top: 6px;
        font-size: 11px;
        color: #94a3b8;
        }
        .speed-scale-labels span {
        position: absolute;
        top: 0;
        white-space: nowrap;
        }
        .status-key {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 12px;
        }
        .status-key-item {
        --status-color: #94a3b8;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        }
        .status-key-item::before {
        content: "";
        display: block;
        flex: 0 0 24px;
        width: 24px;
        height: 5px;
        border-radius: 999px;
        background-color: var(--status-color);
        box-shadow: 0 0 7px var(--status-color);
        }
        .status-key-down {
        --status-color: #f59e0b;
        }
        .status-key-missing {
        --status-color: #38bdf8;
        }
        #tooltip {
        position: fixed;
        display: none;
        z-index: 20;
        pointer-events: none;
        max-width: min(540px, calc(100vw - 28px));
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.94);
        border: 1px solid #475569;
        color: #e5e7eb;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        }
        </style>
    </head>
    <body>
        <div id="app">
            <canvas id="topologyCanvas"></canvas>
        </div>
        <div id="panel">
            <h1>
                __TITLE__
            </h1>
            <div class="meta"></div>
            <div id="groupControls"></div>
            <div class="panel-row">
                <label for="colorMode">color</label> <select id="colorMode">
                    <option value="from">
                        from
                    </option>
                    <option value="to">
                        to
                    </option>
                    <option value="topology">
                        topology
                    </option>
                </select> <button id="fitView" type="button">fit</button>
            </div>
            <div id="speedControls" hidden="">
                <div class="speed-heading">
                    <span>speed range</span> <span class="value" id="speedRangeValue"></span>
                </div>
                <div class="dual-range">
                    <div class="track"></div>
                    <div class="mask mask-left"></div>
                    <div class="mask mask-right"></div><input id="speedMin" type="range" min="0"
                    max="1000" value="0" step="1" aria-label="minimum speed"> <input id="speedMax"
                    type="range" min="0" max="1000" value="1000" step="1" aria-label=
                    "maximum speed">
                </div>
                <div class="range-options">
                    <label class="check-row"><input id="hideOutside" type="checkbox"> <span>hide
                    outside range</span></label> <button id="resetRange" type=
                    "button">reset</button>
                </div>
            </div>
            <div id="speedLegend" hidden="">
                <div class="legend-title"></div>
                <div class="speed-scale"></div>
                <div class="speed-scale-labels"></div>
                <div id="statusKey" class="status-key" hidden="">
                    <span class="status-key-item status-key-down">down</span> <span class=
                    "status-key-item status-key-missing">link absent / not measured</span>
                </div>
                <div class="legend-note"></div>
            </div>
            <div class="panel-help">
                drag = pan, wheel = zoom, double click or fit = reset, hover = details; arrows
                point from the measured source to its destination
            </div>
        </div>
        <div id="tooltip"></div>
        <script>
        const DATA = __DATA_JSON__;
        const canvas = document.getElementById('topologyCanvas');
        const ctx = canvas.getContext('2d');
        const panel = document.getElementById('panel');
        const tooltip = document.getElementById('tooltip');
        const colorMode = document.getElementById('colorMode');
        const groupControls = document.getElementById('groupControls');
        const speedControls = document.getElementById('speedControls');
        const speedLegend = document.getElementById('speedLegend');
        const speedMin = document.getElementById('speedMin');
        const speedMax = document.getElementById('speedMax');
        const speedRangeValue = document.getElementById('speedRangeValue');
        const hideOutside = document.getElementById('hideOutside');
        const maskLeft = document.querySelector('.mask-left');
        const maskRight = document.querySelector('.mask-right');
        const NODE_R = 38;
        const SPEED_LO = 5;
        const SPEED_ZERO = 0;
        const SPEED_HI = 500;

        const linkColor = {
        'spine-spine': '#2563eb',
        'leaf-spine': '#22c55e',
        'exit-spine': '#d946ef',
        'spine-exit': '#22d3ee',
        'exit-exit': '#facc15',
        'leaf-exit': '#ef4444',
        };
        const nodeColor = {
        'public-exit': '#f97316',
        'reverse-exit': '#a78bfa',
        'spine': '#60a5fa',
        'leaf': '#22c55e',
        };
        const speedColorMap = [
        '#000004', '#010005', '#010106', '#010108', '#020109', '#02020b',
        '#02020d', '#03030f', '#030312', '#040414', '#050416', '#060518',
        '#06051a', '#07061c', '#08071e', '#090720', '#0a0822', '#0b0924',
        '#0c0926', '#0d0a29', '#0e0b2b', '#100b2d', '#110c2f', '#120d31',
        '#130d34', '#140e36', '#150e38', '#160f3b', '#180f3d', '#19103f',
        '#1a1042', '#1c1044', '#1d1147', '#1e1149', '#20114b', '#21114e',
        '#221150', '#241253', '#251255', '#271258', '#29115a', '#2a115c',
        '#2c115f', '#2d1161', '#2f1163', '#311165', '#331067', '#341069',
        '#36106b', '#38106c', '#390f6e', '#3b0f70', '#3d0f71', '#3f0f72',
        '#400f74', '#420f75', '#440f76', '#451077', '#471078', '#491078',
        '#4a1079', '#4c117a', '#4e117b', '#4f127b', '#51127c', '#52137c',
        '#54137d', '#56147d', '#57157e', '#59157e', '#5a167e', '#5c167f',
        '#5d177f', '#5f187f', '#601880', '#621980', '#641a80', '#651a80',
        '#671b80', '#681c81', '#6a1c81', '#6b1d81', '#6d1d81', '#6e1e81',
        '#701f81', '#721f81', '#732081', '#752181', '#762181', '#782281',
        '#792282', '#7b2382', '#7c2382', '#7e2482', '#802582', '#812581',
        '#832681', '#842681', '#862781', '#882781', '#892881', '#8b2981',
        '#8c2981', '#8e2a81', '#902a81', '#912b81', '#932b80', '#942c80',
        '#962c80', '#982d80', '#992d80', '#9b2e7f', '#9c2e7f', '#9e2f7f',
        '#a02f7f', '#a1307e', '#a3307e', '#a5317e', '#a6317d', '#a8327d',
        '#aa337d', '#ab337c', '#ad347c', '#ae347b', '#b0357b', '#b2357b',
        '#b3367a', '#b5367a', '#b73779', '#b83779', '#ba3878', '#bc3978',
        '#bd3977', '#bf3a77', '#c03a76', '#c23b75', '#c43c75', '#c53c74',
        '#c73d73', '#c83e73', '#ca3e72', '#cc3f71', '#cd4071', '#cf4070',
        '#d0416f', '#d2426f', '#d3436e', '#d5446d', '#d6456c', '#d8456c',
        '#d9466b', '#db476a', '#dc4869', '#de4968', '#df4a68', '#e04c67',
        '#e24d66', '#e34e65', '#e44f64', '#e55064', '#e75263', '#e85362',
        '#e95462', '#ea5661', '#eb5760', '#ec5860', '#ed5a5f', '#ee5b5e',
        '#ef5d5e', '#f05f5e', '#f1605d', '#f2625d', '#f2645c', '#f3655c',
        '#f4675c', '#f4695c', '#f56b5c', '#f66c5c', '#f66e5c', '#f7705c',
        '#f7725c', '#f8745c', '#f8765c', '#f9785d', '#f9795d', '#f97b5d',
        '#fa7d5e', '#fa7f5e', '#fa815f', '#fb835f', '#fb8560', '#fb8761',
        '#fc8961', '#fc8a62', '#fc8c63', '#fc8e64', '#fc9065', '#fd9266',
        '#fd9467', '#fd9668', '#fd9869', '#fd9a6a', '#fd9b6b', '#fe9d6c',
        '#fe9f6d', '#fea16e', '#fea36f', '#fea571', '#fea772', '#fea973',
        '#feaa74', '#feac76', '#feae77', '#feb078', '#feb27a', '#feb47b',
        '#feb67c', '#feb77e', '#feb97f', '#febb81', '#febd82', '#febf84',
        '#fec185', '#fec287', '#fec488', '#fec68a', '#fec88c', '#feca8d',
        '#fecc8f', '#fecd90', '#fecf92', '#fed194', '#fed395', '#fed597',
        '#fed799', '#fed89a', '#fdda9c', '#fddc9e', '#fddea0', '#fde0a1',
        '#fde2a3', '#fde3a5', '#fde5a7', '#fde7a9', '#fde9aa', '#fdebac',
        '#fcecae', '#fceeb0', '#fcf0b2', '#fcf2b4', '#fcf4b6', '#fcf6b8',
        '#fcf7b9', '#fcf9bb', '#fcfbbd', '#fcfdbf',
        ];

        const nodeById = new Map(DATA.nodes.map(node => [node.id, node]));
        const edgeById = new Map(DATA.edges.map(edge => [edge.id, edge]));
        const layout = DATA.layout_2d;
        const visualNodes = layout.nodes.map(item => ({
          ...nodeById.get(item.node_id),
          visualId: item.visual_id,
          x: item.x,
          y: item.y,
          row: item.row,
          directView: item.direct_view,
        }));
        const visualEdges = layout.edges
          .map(item => ({
            visualId: item.visual_id,
            edge: item.edge || edgeById.get(item.edge_id),
            group: item.group,
            sourceId: item.source_id,
            targetId: item.target_id,
            paths: item.paths,
          }))
          .filter(item => item.edge);

        const meta = panel.querySelector('.meta');
        const metaSummary = document.createElement('div');
        metaSummary.textContent =
          `${DATA.nodes.length} nodes, ${visualEdges.length} links`;
        meta.appendChild(metaSummary);
        if (DATA.source) {
        const source = document.createElement('div');
        source.className = 'source';
        source.textContent = DATA.source;
        meta.appendChild(source);
        }

        const groupLabels = new Map(DATA.groups.map(group => [group.id, group.label]));
        const groupOrder = DATA.groups.map(group => group.id);
        const visualGroupCounts = new Map();
        visualEdges.forEach(edge => {
        visualGroupCounts.set(edge.group, (visualGroupCounts.get(edge.group) || 0) + 1);
        });
        for (const groupId of groupOrder) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.dataset.group = groupId;
        input.checked = (visualGroupCounts.get(groupId) || 0) > 0;
        label.appendChild(input);
        const line = document.createElement('span');
        line.className = 'legend-line';
        line.style.background = linkColor[groupId] || '#94a3b8';
        line.style.color = linkColor[groupId] || '#94a3b8';
        label.appendChild(line);
        const text = document.createElement('span');
        text.className = 'legend-text';
        const name = document.createElement('span');
        name.className = 'legend-name';
        name.textContent = groupLabels.get(groupId) || groupId;
        text.appendChild(name);
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = `(${visualGroupCounts.get(groupId) || 0})`;
        text.append(' ', count);
        label.appendChild(text);
        groupControls.appendChild(label);
        }

        if (DATA.topology_only) {
        colorMode.value = 'topology';
        colorMode.querySelectorAll('option').forEach(option => {
          option.disabled = option.value !== 'topology';
        });
        } else if (
          DATA.initial_mode &&
          colorMode.querySelector(`option[value="${DATA.initial_mode}"]`)
        ) {
        colorMode.value = DATA.initial_mode;
        }

        function activeGroups() {
        const out = new Set();
        document.querySelectorAll('input[data-group]').forEach(input => {
          if (input.checked) out.add(input.dataset.group);
        });
        return out;
        }
        function metricForDirection(edge, sourceId) {
        return sourceId === edge.a ? edge.a_to_b : edge.b_to_a;
        }
        function directedVisualEdge(visualEdge, mode) {
        if (mode === 'to') {
          return {
            sourceId: visualEdge.targetId,
            targetId: visualEdge.sourceId,
            metric: metricForDirection(visualEdge.edge, visualEdge.targetId),
            points: visualEdge.paths.to,
          };
        }
        return {
          sourceId: visualEdge.sourceId,
          targetId: visualEdge.targetId,
          metric: metricForDirection(visualEdge.edge, visualEdge.sourceId),
          points: mode === 'topology'
            ? visualEdge.paths.topology
            : visualEdge.paths.from,
        };
        }
        function metricValue(visualEdge, mode) {
        if (mode === 'topology' || DATA.topology_only) return null;
        const directed = directedVisualEdge(visualEdge, mode);
        if (!directed.metric || directed.metric.status !== 'up') return 0;
        return directed.metric.mbps;
        }
        function speedColor(mbps) {
        const lo = Math.log10(SPEED_LO);
        const hi = Math.log10(SPEED_HI);
        const value = Math.log10(Math.max(SPEED_LO, mbps));
        const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo)));
        return speedColorMap[Math.round(t * (speedColorMap.length - 1))];
        }
        function metricStatus(visualEdge, mode) {
        if (mode === 'topology' || DATA.topology_only) return null;
        const directed = directedVisualEdge(visualEdge, mode);
        return directed.metric ? directed.metric.status : 'missing';
        }
        function statusColor(status) {
        if (status === 'down') return '#f59e0b';
        if (status === 'iperf-fail') return '#38bdf8';
        if (status === 'ssh-fail') return '#38bdf8';
        if (status === 'jq-missing') return '#38bdf8';
        if (status === 'missing') return '#38bdf8';
        return '#38bdf8';
        }
        function colorFor(visualEdge, mode) {
        const mbps = metricValue(visualEdge, mode);
        if (mbps === null) return linkColor[visualEdge.group] || '#94a3b8';
        if (mbps <= 0) return statusColor(metricStatus(visualEdge, mode));
        return speedColor(mbps);
        }
        function sliderToSpeed(value) {
        const numeric = Number(value);
        if (numeric <= 0) return SPEED_ZERO;
        const fraction = numeric / 1000;
        return SPEED_LO * Math.pow(SPEED_HI / SPEED_LO, fraction);
        }
        function speedToText(value) {
        if (value <= 0) return '0';
        if (value < 10) return value.toFixed(1);
        if (value < 100) return value.toFixed(1);
        return value.toFixed(0);
        }
        function selectedSpeedRange() {
        return {
          min: sliderToSpeed(speedMin.value),
          max: sliderToSpeed(speedMax.value),
        };
        }
        function metricInRange(visualEdge, mode) {
        const mbps = metricValue(visualEdge, mode);
        const range = selectedSpeedRange();
        if (mbps === null) return true;
        if (mbps <= 0) return range.min === SPEED_ZERO;
        const aboveMin = Number(speedMin.value) === 0 || mbps >= range.min;
        const belowMax = Number(speedMax.value) === 1000 || mbps <= range.max;
        return aboveMin && belowMax;
        }
        function updateSpeedRangeUi(changed) {
        let lo = Number(speedMin.value);
        let hi = Number(speedMax.value);
        if (lo > hi) {
          if (changed === speedMin) hi = lo;
          else lo = hi;
          speedMin.value = String(lo);
          speedMax.value = String(hi);
        }
        const range = selectedSpeedRange();
        speedRangeValue.textContent =
          `${speedToText(range.min)}-${speedToText(range.max)} Mbit/s`;
        maskLeft.style.width = `${lo / 10}%`;
        maskRight.style.width = `${(1000 - hi) / 10}%`;
        draw();
        }
        function metricText(metric) {
        if (!metric) return 'missing';
        return `${metric.mbps.toFixed(1)} Mbit/s ${metric.status}`;
        }
        function edgeTooltip(visualEdge) {
        const source = nodeById.get(visualEdge.sourceId);
        const target = nodeById.get(visualEdge.targetId);
        if (!source || !target) return `${visualEdge.group} (${visualEdge.edge.link_type})`;
        const forward = metricForDirection(visualEdge.edge, source.id);
        const reverse = metricForDirection(visualEdge.edge, target.id);
        return `${visualEdge.group} (${visualEdge.edge.link_type})\n` +
          `${source.name} -> ${target.name}: ${metricText(forward)}\n` +
          `${target.name} -> ${source.name}: ${metricText(reverse)}`;
        }

        function refreshLegend() {
        const mode = colorMode.value;
        const title = speedLegend.querySelector('.legend-title');
        const scale = speedLegend.querySelector('.speed-scale');
        const labels = speedLegend.querySelector('.speed-scale-labels');
        const note = speedLegend.querySelector('.legend-note');
        const statusKey = document.getElementById('statusKey');
        speedLegend.hidden = false;
        const topologyMode = DATA.topology_only || mode === 'topology';
        speedControls.hidden = topologyMode;
        statusKey.hidden = topologyMode;
        if (topologyMode) {
          title.textContent = 'topology colors';
          scale.style.background = [
            'linear-gradient(90deg',
            '#2563eb 0%',
            '#22c55e 20%',
            '#d946ef 40%',
            '#22d3ee 60%',
            '#ef4444 80%',
            '#facc15 100%)',
          ].join(', ');
          labels.innerHTML = [
            '<span style="left:0;transform:none">spine-spine</span>',
            '<span style="left:20%;transform:translateX(-50%)">leaf-spine</span>',
            '<span style="left:40%;transform:translateX(-50%)">exit-spine</span>',
            '<span style="left:60%;transform:translateX(-50%)">spine-exit</span>',
            '<span style="left:80%;transform:translateX(-50%)">leaf-exit</span>',
            '<span style="right:0">exit-exit</span>',
          ].join('');
          note.textContent = 'Link colors show topology groups only. The speed range is inactive.';
          return;
        }
        title.textContent = `speed colors: ${mode}`;
        scale.style.background = [
          'linear-gradient(90deg',
          '#000004 0%',
          '#2c115f 18%',
          '#721f81 35%',
          '#b73779 52%',
          '#f1605d 68%',
          '#feb078 84%',
          '#fcfdbf 100%)',
        ].join(', ');
        labels.innerHTML = [
          '<span style="left:0;transform:none">0</span>',
          '<span style="left:30%;transform:translateX(-50%)">20</span>',
          '<span style="left:65%;transform:translateX(-50%)">100</span>',
          '<span style="right:0">500 Mbit/s</span>',
        ].join('');
        note.textContent = [
          `Arrows and colors show ${mode} direction.`,
          'Amber means down. Cyan means the link is absent or no usable',
          'speed measurement was obtained.',
          'A filter minimum of 0 includes down and links absent / not measured.',
        ].join(' ');
        }

        let view = { scale: 1, x: 0, y: 0 };
        let deviceScale = 1;
        let dragging = false;
        let dragPoint = null;
        let hovered = null;

        function fitView() {
        const leftInset = innerWidth >= 900 ? 430 : 20;
        const rightInset = 20;
        const topInset = 20;
        const bottomInset = 20;
        const availableWidth = Math.max(200, innerWidth - leftInset - rightInset);
        const availableHeight = Math.max(200, innerHeight - topInset - bottomInset);
        view.scale = Math.min(
          availableWidth / layout.width,
          availableHeight / layout.height,
        );
        view.scale = Math.max(0.2, Math.min(3.5, view.scale));
        view.x = leftInset + (availableWidth - layout.width * view.scale) / 2;
        view.y = topInset + (availableHeight - layout.height * view.scale) / 2;
        draw();
        }
        function resizeCanvas() {
        deviceScale = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * deviceScale);
        canvas.height = Math.round(innerHeight * deviceScale);
        canvas.style.width = `${innerWidth}px`;
        canvas.style.height = `${innerHeight}px`;
        fitView();
        }
        function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - view.x) / view.scale,
          y: (clientY - view.y) / view.scale,
        };
        }
        function setWorldTransform() {
        ctx.setTransform(
          deviceScale * view.scale,
          0,
          0,
          deviceScale * view.scale,
          deviceScale * view.x,
          deviceScale * view.y,
        );
        }
        function drawGrid() {
        ctx.save();
        ctx.strokeStyle = 'rgba(71, 85, 105, 0.16)';
        ctx.lineWidth = 1 / view.scale;
        ctx.beginPath();
        for (let x = 0; x <= layout.width; x += 50) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, layout.height);
        }
        for (let y = 0; y <= layout.height; y += 50) {
          ctx.moveTo(0, y);
          ctx.lineTo(layout.width, y);
        }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.28)';
        ctx.strokeRect(0, 0, layout.width, layout.height);
        ctx.restore();
        }
        function drawRowLabels() {
        ctx.save();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 15px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        layout.row_labels.forEach(label => {
          ctx.fillText(label.text, label.x, label.y);
        });
        ctx.restore();
        }
        function pathMarker(points, fraction) {
        if (points.length < 2) return null;
        const lengths = [];
        let total = 0;
        for (let index = 0; index < points.length - 1; index += 1) {
          const length = Math.hypot(
            points[index + 1].x - points[index].x,
            points[index + 1].y - points[index].y,
          );
          lengths.push(length);
          total += length;
        }
        if (total < 0.01) return null;
        let remaining = total * fraction;
        for (let index = 0; index < lengths.length; index += 1) {
          const length = lengths[index];
          if (remaining > length && index < lengths.length - 1) {
            remaining -= length;
            continue;
          }
          const start = points[index];
          const end = points[index + 1];
          const ratio = Math.min(1, remaining / Math.max(length, 0.01));
          return {
            x: start.x + (end.x - start.x) * ratio,
            y: start.y + (end.y - start.y) * ratio,
            angle: Math.atan2(end.y - start.y, end.x - start.x),
          };
        }
        return null;
        }
        function drawArrow(points, color, alpha) {
        const marker = pathMarker(points, 0.62);
        if (!marker) return;
        const size = 12;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(marker.x, marker.y);
        ctx.rotate(marker.angle);
        ctx.fillStyle = color;
        ctx.strokeStyle = 'rgba(2, 6, 23, 0.92)';
        ctx.lineWidth = 2.4;
        ctx.lineJoin = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(-size * 0.72, -size * 0.62);
        ctx.lineTo(-size * 0.72, size * 0.62);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        }
        function edgeLineWidth(group) {
        if (group === 'spine-spine') return 2.4;
        if (group === 'exit-exit') return 2.2;
        if (group === 'spine-exit' || group === 'exit-spine') return 1.8;
        return 1.9;
        }
        function drawEdge(visualEdge, mode, active, hover) {
        if (!active.has(visualEdge.group)) return;
        const inRange = metricInRange(visualEdge, mode);
        if (!inRange && hideOutside.checked) return;
        const directed = directedVisualEdge(visualEdge, mode);
        const points = directed.points;
        const color = colorFor(visualEdge, mode);
        const alpha = inRange ? 0.92 : 0.10;
        const baseWidth = edgeLineWidth(visualEdge.group);
        ctx.save();
        ctx.globalAlpha = hover ? 1 : alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = hover ? baseWidth + 1.8 : baseWidth;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = hover ? 12 : 4;
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.stroke();
        ctx.restore();
        if ((mode === 'from' || mode === 'to') && (inRange || !hideOutside.checked)) {
          drawArrow(points, color, hover ? 1 : alpha);
        }
        }
        function drawNode(node, hover) {
        const fill = nodeColor[node.layer] || '#94a3b8';
        ctx.save();
        ctx.shadowColor = fill;
        ctx.shadowBlur = hover ? 20 : 9;
        ctx.fillStyle = fill;
        ctx.strokeStyle = hover ? '#f8fafc' : 'rgba(226, 232, 240, 0.68)';
        ctx.lineWidth = hover ? 3 : 1.5;
        ctx.beginPath();
        ctx.arc(node.x, node.y, NODE_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#07111f';
        ctx.font = '700 13px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = node.name.length > 12
          ? `${node.name.slice(0, 9)}...`
          : node.name;
        ctx.fillText(label, node.x, node.y);
        ctx.restore();
        }
        function draw() {
        ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.fillStyle = '#0b1020';
        ctx.fillRect(0, 0, innerWidth, innerHeight);
        setWorldTransform();
        drawGrid();
        drawRowLabels();
        const mode = colorMode.value;
        const active = activeGroups();
        for (const edge of visualEdges) {
          drawEdge(edge, mode, active, hovered && hovered.kind === 'edge' && hovered.item === edge);
        }
        for (const node of visualNodes) {
          drawNode(node, hovered && hovered.kind === 'node' && hovered.item === node);
        }
        }

        function pointSegmentDistance(point, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (!lengthSquared) return Math.hypot(point.x - a.x, point.y - a.y);
        let t = ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSquared;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(point.x - (a.x + t * dx), point.y - (a.y + t * dy));
        }
        function findHovered(world) {
        for (let index = visualNodes.length - 1; index >= 0; index -= 1) {
          const node = visualNodes[index];
          if (Math.hypot(world.x - node.x, world.y - node.y) <= NODE_R + 4 / view.scale) {
            return { kind: 'node', item: node };
          }
        }
        const active = activeGroups();
        const mode = colorMode.value;
        const threshold = 8 / view.scale;
        for (let index = visualEdges.length - 1; index >= 0; index -= 1) {
          const edge = visualEdges[index];
          if (!active.has(edge.group)) continue;
          if (!metricInRange(edge, mode) && hideOutside.checked) continue;
          const points = directedVisualEdge(edge, mode).points;
          for (let segment = 0; segment < points.length - 1; segment += 1) {
            const distance = pointSegmentDistance(
              world,
              points[segment],
              points[segment + 1],
            );
            if (distance <= threshold) {
              return { kind: 'edge', item: edge };
            }
          }
        }
        return null;
        }
        function showTooltip(event) {
        if (!hovered) {
          tooltip.style.display = 'none';
          return;
        }
        if (hovered.kind === 'node') {
          const node = hovered.item;
          tooltip.textContent = `${node.kind}:${node.name}\nlayer: ${node.layer}` +
            (node.directView ? '\nview: direct leaf-exit row' : '');
        } else {
          tooltip.textContent = edgeTooltip(hovered.item);
        }
        tooltip.style.display = 'block';
        const left = Math.min(event.clientX + 14, innerWidth - tooltip.offsetWidth - 14);
        const top = Math.min(event.clientY + 14, innerHeight - tooltip.offsetHeight - 14);
        tooltip.style.left = `${Math.max(8, left)}px`;
        tooltip.style.top = `${Math.max(8, top)}px`;
        }

        canvas.addEventListener('pointerdown', event => {
        dragging = true;
        dragPoint = { x: event.clientX, y: event.clientY };
        canvas.classList.add('dragging');
        canvas.setPointerCapture(event.pointerId);
        tooltip.style.display = 'none';
        });
        canvas.addEventListener('pointermove', event => {
        if (dragging && dragPoint) {
          view.x += event.clientX - dragPoint.x;
          view.y += event.clientY - dragPoint.y;
          dragPoint = { x: event.clientX, y: event.clientY };
          hovered = null;
          draw();
          return;
        }
        const next = findHovered(screenToWorld(event.clientX, event.clientY));
        if (!hovered || !next || hovered.kind !== next.kind || hovered.item !== next.item) {
          hovered = next;
          draw();
        }
        showTooltip(event);
        });
        function stopDragging(event) {
        dragging = false;
        dragPoint = null;
        canvas.classList.remove('dragging');
        if (event && canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
        }
        canvas.addEventListener('pointerup', stopDragging);
        canvas.addEventListener('pointercancel', stopDragging);
        canvas.addEventListener('pointerleave', event => {
        if (!dragging) {
          hovered = null;
          tooltip.style.display = 'none';
          draw();
        }
        });
        canvas.addEventListener('wheel', event => {
        event.preventDefault();
        const before = screenToWorld(event.clientX, event.clientY);
        const factor = Math.exp(-event.deltaY * 0.0012);
        view.scale = Math.max(0.15, Math.min(5, view.scale * factor));
        view.x = event.clientX - before.x * view.scale;
        view.y = event.clientY - before.y * view.scale;
        draw();
        }, { passive: false });
        canvas.addEventListener('dblclick', fitView);

        document.querySelectorAll('input[data-group]').forEach(input => {
        input.addEventListener('change', draw);
        });
        colorMode.addEventListener('change', () => {
        refreshLegend();
        draw();
        });
        speedMin.addEventListener('input', () => updateSpeedRangeUi(speedMin));
        speedMax.addEventListener('input', () => updateSpeedRangeUi(speedMax));
        hideOutside.addEventListener('change', draw);
        document.getElementById('resetRange').addEventListener('click', () => {
        speedMin.value = '0';
        speedMax.value = '1000';
        updateSpeedRangeUi(null);
        });
        document.getElementById('fitView').addEventListener('click', fitView);
        addEventListener('resize', resizeCanvas);

        refreshLegend();
        updateSpeedRangeUi(null);
        resizeCanvas();
        </script>
    </body>
</html>
