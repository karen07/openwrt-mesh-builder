        <style>
        :root {
        color-scheme: dark;
        }
        html,
        body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        }
        body {
        background: #0b1020;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        }
        #app {
        width: 100vw;
        height: 100vh;
        display: block;
        }
        #panel {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        width: 380px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.30);
        border-radius: 16px;
        padding: 18px 18px 16px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(8px);
        }
        #panel h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.15;
        }
        #panel .meta {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
        word-break: break-word;
        }
        #panel .meta .source {
        margin-top: 4px;
        }
        #panel select,
        #panel button {
        background: rgba(15, 23, 42, 0.95);
        color: #f3f4f6;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 6px;
        padding: 4px 9px;
        font: inherit;
        }
        #panel button {
        cursor: pointer;
        }
        #groupControls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 22px;
        }
        #groupControls label,
        .check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        cursor: pointer;
        user-select: none;
        min-width: 0;
        }
        #groupControls input[type="checkbox"],
        .check-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: #3b82f6;
        flex: 0 0 auto;
        }
        .legend-line {
        width: 24px;
        height: 3px;
        border-radius: 999px;
        flex: 0 0 auto;
        box-shadow: 0 0 8px currentColor;
        }
        .legend-text {
        font-size: 14px;
        color: #e5e7eb;
        min-width: 0;
        }
        .legend-name {
        white-space: nowrap;
        }
        #groupControls .count {
        color: #94a3b8;
        font-size: 11px;
        margin-left: 2px;
        }
        .panel-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
        font-size: 15px;
        color: #e5e7eb;
        }
        .panel-row .spacer {
        flex: 1 1 auto;
        }
        .panel-help {
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 14px;
        }
        #speedControls,
        #speedLegend {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.20);
        }
        #speedControls[hidden],
        #speedLegend[hidden] {
        display: none;
        }
        .speed-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
        font-size: 13px;
        color: #cbd5e1;
        }
        .speed-heading .value {
        margin-left: auto;
        color: #f8fafc;
        font-variant-numeric: tabular-nums;
        }
        .dual-range {
        position: relative;
        height: 28px;
        margin: 0 1px;
        }
        .dual-range .track {
        position: absolute;
        left: 0;
        right: 0;
        top: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.30);
        background: linear-gradient(
        90deg,
        #000004 0%,
        #2c115f 18%,
        #721f81 35%,
        #b73779 52%,
        #f1605d 68%,
        #feb078 84%,
        #fcfdbf 100%
        );
        box-shadow: inset 0 0 8px rgba(15, 23, 42, 0.32);
        }
        .dual-range .mask {
        position: absolute;
        top: 10px;
        height: 12px;
        background: rgba(2, 6, 23, 0.72);
        pointer-events: none;
        }
        .dual-range .mask-left {
        left: 0;
        border-radius: 999px 0 0 999px;
        }
        .dual-range .mask-right {
        right: 0;
        border-radius: 0 999px 999px 0;
        }
        .dual-range input[type="range"] {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 28px;
        margin: 0;
        appearance: none;
        background: transparent;
        pointer-events: none;
        }
        .dual-range input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: transparent;
        border: 0;
        }
        .dual-range input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -3px;
        border-radius: 50%;
        border: 2px solid #e2e8f0;
        background: #0f172a;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
        pointer-events: auto;
        cursor: ew-resize;
        }
        .dual-range input[type="range"]::-moz-range-track {
        height: 10px;
        background: transparent;
        border: 0;
        }
        .dual-range input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #e2e8f0;
        background: #0f172a;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
        pointer-events: auto;
        cursor: ew-resize;
        }
        .range-options {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: #cbd5e1;
        font-size: 12px;
        }
        .range-options button {

        padding: 2px 8px;
        font-size: 12px;

        #speedLegend .legend-title {
        font-size: 13px;
        color: #cbd5e1;
        margin-bottom: 8px;
        }
        #speedLegend .legend-note {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.35;
        }
        .speed-scale {
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.30);
        box-shadow: inset 0 0 8px rgba(15, 23, 42, 0.32);
        }
        .speed-scale-labels {
        position: relative;
        height: 16px;
        margin-top: 6px;
        font-size: 11px;
        color: #94a3b8;
        }
        .speed-scale-labels span {
        position: absolute;
        top: 0;
        white-space: nowrap;
        }
        .status-key {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 12px;
        }
        .status-key-item {
        --status-color: #94a3b8;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        }
        .status-key-item::before {
        content: "";
        display: block;
        flex: 0 0 24px;
        width: 24px;
        height: 5px;
        border-radius: 999px;
        background-color: var(--status-color);
        box-shadow: 0 0 7px var(--status-color);

                    <div class="mask mask-left"></div>
                    <div class="mask mask-right"></div><input id="speedMin" type="range" min="0"

                drag = rotate, wheel = zoom, right drag = pan, hover = details; arrows point from

        <script type="module">
        import * as THREE from 'three';

        const ORBIT_URL = __ORBIT_URL_JSON__;
        const { OrbitControls } = await import(ORBIT_URL);
        const DATA = __DATA_JSON__;
        const app = document.getElementById('app');
        const panel = document.getElementById('panel');
        const tooltip = document.getElementById('tooltip');
        const meta = panel.querySelector('.meta');
        const metaSummary = document.createElement('div');
        metaSummary.textContent = `${DATA.nodes.length} nodes, ${DATA.edges.length} links`;
        meta.appendChild(metaSummary);
        if (DATA.source) {
        const metaSource = document.createElement('div');
        metaSource.className = 'source';
        metaSource.textContent = DATA.source;
        meta.appendChild(metaSource);
        }

        const groupControls = document.getElementById('groupControls');
        const speedControls = document.getElementById('speedControls');
        const speedLegend = document.getElementById('speedLegend');
        const speedLegendTitle = speedLegend.querySelector('.legend-title');
        const speedLegendNote = speedLegend.querySelector('.legend-note');
        const statusKey = document.getElementById('statusKey');
        const speedMin = document.getElementById('speedMin');
        const speedMax = document.getElementById('speedMax');
        const speedRangeValue = document.getElementById('speedRangeValue');
        const hideOutside = document.getElementById('hideOutside');
        const maskLeft = speedControls.querySelector('.mask-left');
        const maskRight = speedControls.querySelector('.mask-right');
        const SPEED_LO = 5;
        const SPEED_ZERO = 0;
        const SPEED_HI = 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1020);

        const camera = new THREE.PerspectiveCamera(
        55,
        innerWidth / innerHeight,
        1,
        5000,
        );
        camera.position.set(760, 540, 900);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        app.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, -60, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 1.7));
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(600, 900, 400);
        scene.add(light);

        const nodeById = new Map(DATA.nodes.map(n => [n.id, n]));
        const objects = [];
        const edgeObjects = [];
        const nodeObjects = [];

        'leaf': 0x22c55e,
        'reverse-exit': 0xa78bfa,

        ];

        for (const group of DATA.groups) {
        const label = document.createElement('label');

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.dataset.group = group.id;
        input.checked = group.count > 0;
        label.appendChild(input);

        const line = document.createElement('span');
        line.className = 'legend-line';
        line.style.background = linkColorHex[group.id] || '#94a3b8';
        line.style.color = linkColorHex[group.id] || '#94a3b8';
        label.appendChild(line);

        const text = document.createElement('span');
        text.className = 'legend-text';
        const name = document.createElement('span');
        name.className = 'legend-name';
        name.textContent = group.label;
        text.appendChild(name);

        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = `(${group.count})`;
        text.append(' ', count);

        label.appendChild(text);
        groupControls.appendChild(label);
        }

        function pos(node) {
        return new THREE.Vector3(node.x, node.y, node.z);
        }

        function edgeLaneOffset(edge) {
        if (edge.group === 'spine-exit') return -7;
        if (edge.group === 'exit-spine') return 7;
        return 0;
        }

        function edgePoints(a, b, edge) {
        const start = pos(a);
        const end = pos(b);
        const offset = edgeLaneOffset(edge);
        if (!offset) return [start, end];

        const dir = new THREE.Vector3().subVectors(end, start);
        const lane = new THREE.Vector3().crossVectors(
        dir,
        new THREE.Vector3(0, 1, 0),
        );
        if (lane.lengthSq() < 0.0001) lane.set(1, 0, 0);
        lane.normalize().multiplyScalar(offset);

        return [start.add(lane), end.add(lane)];
        }

        function makeLabel(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = '24px system-ui, sans-serif';
        const width = Math.ceil(ctx.measureText(text).width + 24);
        canvas.width = Math.max(96, width);
        canvas.height = 42;
        ctx.font = '24px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e5e7eb';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(canvas.width * 0.45, canvas.height * 0.45, 1);
        return sprite;
        }

        function layerGuide(layer) {
        const layerNodes = DATA.nodes.filter(n => n.layer === layer.id);
        if (!layerNodes.length) return;
        const radius = Math.max(...layerNodes.map(n => Math.hypot(n.x, n.z)));
        const points = [];
        for (let i = 0; i <= 96; i++) {
        const a = i * Math.PI * 2 / 96;
        points.push(new THREE.Vector3(
          Math.cos(a) * radius,
          layer.y,
          Math.sin(a) * radius,
        ));
        }
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
        color: 0x334155,
        transparent: true,
        opacity: 0.6,
        });
        scene.add(new THREE.Line(geom, mat));
        }

        for (const layer of DATA.layers) layerGuide(layer);

        for (const node of DATA.nodes) {
        const mat = new THREE.MeshStandardMaterial({
        color: layerColor[node.layer] || 0xe5e7eb,
        });
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(18, 32, 16), mat);
        sphere.position.copy(pos(node));
        sphere.userData = { type: 'node', node };
        scene.add(sphere);
        objects.push(sphere);
        nodeObjects.push(sphere);

        const label = makeLabel(node.name);
        label.position.set(node.x, node.y + 34, node.z);
        scene.add(label);
        }

        function edgeOrderedEnds(edge) {
        const a = nodeById.get(edge.a);
        const b = nodeById.get(edge.b);
        if (!a || !b) return null;

        function withOrder(source, target) {
        return {
          source,
          target,
          metric: source.id === edge.a ? edge.a_to_b : edge.b_to_a,
        };
        }

        if (edge.group === 'spine-spine' || edge.group === 'exit-exit') {
        const source = nodeById.get(edge.source_id);
        const target = nodeById.get(edge.target_id);
        if (source && target) return withOrder(source, target);
        }
        if (edge.group === 'leaf-spine') {
        return a.layer === 'leaf' ? withOrder(a, b) : withOrder(b, a);
        }
        if (edge.group === 'exit-spine') {
        return a.layer === 'reverse-exit' ? withOrder(a, b) : withOrder(b, a);
        }
        if (edge.group === 'spine-exit') {
        return a.layer === 'spine' ? withOrder(a, b) : withOrder(b, a);
        }
        if (edge.group === 'leaf-exit') {
        return a.layer === 'leaf' ? withOrder(a, b) : withOrder(b, a);
        }
        return withOrder(a, b);
        }

        function directedEdge(edge, mode) {
        const ordered = edgeOrderedEnds(edge);
        if (!ordered) return null;
        if (mode === 'to') {
        return {
          source: ordered.target,
          target: ordered.source,
          metric: ordered.target.id === edge.a ? edge.a_to_b : edge.b_to_a,
        };
        }
        return ordered;
        }

        function metricValue(edge, mode) {
        if (mode === 'topology' || DATA.topology_only) return null;
        const directed = directedEdge(edge, mode);
        if (!directed || !directed.metric) return 0;
        return directed.metric.status === 'up' ? directed.metric.mbps : 0;
        }

        function speedColor(mbps) {
        const lo = Math.log10(5);
        const hi = Math.log10(500);
        const value = Math.log10(Math.max(5, mbps));
        const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo)));
        const idx = Math.round(t * (speedColorMap.length - 1));
        return new THREE.Color(speedColorMap[idx]);
        }

        function metricStatus(edge, mode) {
        if (mode === 'topology' || DATA.topology_only) return null;
        const directed = directedEdge(edge, mode);
        return directed && directed.metric ? directed.metric.status : 'missing';
        }

        function statusColor(status) {
        if (status === 'down') return 0xf59e0b;
        if (status === 'iperf-fail') return 0x38bdf8;
        if (status === 'ssh-fail') return 0x38bdf8;
        if (status === 'jq-missing') return 0x38bdf8;
        if (status === 'missing') return 0x38bdf8;
        return 0x38bdf8;
        }

        function colorFor(edge, mode) {
        const mbps = metricValue(edge, mode);
        if (mbps === null) return linkColor[edge.group] || 0x94a3b8;
        if (mbps <= 0) return statusColor(metricStatus(edge, mode));
        return speedColor(mbps);
        }

        function sliderToSpeed(value) {
        const numeric = Number(value);
        if (numeric <= 0) return SPEED_ZERO;
        const fraction = numeric / 1000;
        return SPEED_LO * Math.pow(SPEED_HI / SPEED_LO, fraction);
        }

        function speedToText(value) {
        if (value <= 0) return '0';
        if (value < 10) return value.toFixed(1);
        if (value < 100) return value.toFixed(1);
        return value.toFixed(0);
        }

        function selectedSpeedRange() {
        return {
          min: sliderToSpeed(speedMin.value),
          max: sliderToSpeed(speedMax.value),
        };
        }

        function metricInRange(edge, mode) {
        const mbps = metricValue(edge, mode);
        const range = selectedSpeedRange();
        if (mbps === null) return true;
        if (mbps <= 0) return range.min === SPEED_ZERO;
        const aboveMin = Number(speedMin.value) === 0 || mbps >= range.min;
        const belowMax = Number(speedMax.value) === 1000 || mbps <= range.max;
        return aboveMin && belowMax;
        }

        function updateSpeedRangeUi(changed) {
        let lo = Number(speedMin.value);
        let hi = Number(speedMax.value);
        if (lo > hi) {
          if (changed === speedMin) hi = lo;
          else lo = hi;
          speedMin.value = String(lo);
          speedMax.value = String(hi);
        }
        const range = selectedSpeedRange();
        speedRangeValue.textContent =
          `${speedToText(range.min)}-${speedToText(range.max)} Mbit/s`;
        maskLeft.style.width = `${lo / 10}%`;
        maskRight.style.width = `${(1000 - hi) / 10}%`;
        refreshEdges();
        }

        function metricText(m) {
        if (!m) return 'missing';
        return `${m.mbps.toFixed(1)} Mbit/s ${m.status} ` +
        `via ${m.iface} ${m.peer_ip}`;
        }

        function edgeTooltip(edge, mode) {
        const ordered = edgeOrderedEnds(edge);
        if (!ordered) return `${edge.group} (${edge.link_type})`;
        const forward = ordered.source.id === edge.a ? edge.a_to_b : edge.b_to_a;
        const reverse = ordered.target.id === edge.a ? edge.a_to_b : edge.b_to_a;
        return `${edge.group} (${edge.link_type})
        ` +
        `${ordered.source.name} -> ${ordered.target.name}: ${metricText(forward)}
        ` +
        `${ordered.target.name} -> ${ordered.source.name}: ${metricText(reverse)}`;
        }

        function updateArrow(line, mode) {
        const arrow = line.userData.arrow;
        if (!arrow) return;
        if (mode !== 'from' && mode !== 'to') {
        arrow.visible = false;
        return;
        }
        const directed = directedEdge(line.userData.edge, mode);
        const a = nodeById.get(line.userData.edge.a);
        const b = nodeById.get(line.userData.edge.b);
        if (!directed || !a || !b) {
        arrow.visible = false;
        return;
        }
        const points = edgePoints(a, b, line.userData.edge);
        let start = points[0].clone();
        let end = points[1].clone();
        if (directed.source.id !== line.userData.edge.a) {
        const swap = start;
        start = end;
        end = swap;
        }
        const dir = new THREE.Vector3().subVectors(end, start);
        if (dir.lengthSq() < 0.000001) {
        arrow.visible = false;
        return;
        }
        dir.normalize();
        arrow.position.copy(start).lerp(end, 0.62);
        arrow.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir,
        );
        arrow.material.color.set(line.material.color);
        arrow.material.opacity = line.material.opacity;
        arrow.visible = line.visible;
        }

        for (const edge of DATA.edges) {
        const a = nodeById.get(edge.a);
        const b = nodeById.get(edge.b);
        if (!a || !b) continue;
        const geom = new THREE.BufferGeometry().setFromPoints(
        edgePoints(a, b, edge),
        );
        const mat = new THREE.LineBasicMaterial({
        color: colorFor(edge, 'topology'),
        linewidth: 2,
        transparent: true,
        opacity: 1,
        });
        const line = new THREE.Line(geom, mat);
        const arrow = new THREE.Mesh(
        new THREE.ConeGeometry(7, 20, 12),
        new THREE.MeshStandardMaterial({
          color: colorFor(edge, 'topology'),
          transparent: true,
          opacity: 1,
          depthTest: false,
        }),
        );
        arrow.renderOrder = 10;
        arrow.visible = false;
        line.userData = { type: 'edge', edge, arrow };
        scene.add(line);
        scene.add(arrow);
        edgeObjects.push(line);
        objects.push(line);
        }

        const raycaster = new THREE.Raycaster();
        raycaster.params.Line.threshold = 10;
        const mouse = new THREE.Vector2();

        function activeGroups() {
        const out = new Set();
        document.querySelectorAll('input[data-group]').forEach(input => {
        if (input.checked) out.add(input.dataset.group);
        });
        return out;
        }

        function refreshSpeedLegend(mode) {
        const scale = speedLegend.querySelector('.speed-scale');
        const labels = speedLegend.querySelector('.speed-scale-labels');
        speedLegend.hidden = false;
        if (DATA.topology_only || mode === 'topology') {
        speedControls.hidden = true;
        statusKey.hidden = true;
        speedLegendTitle.textContent = 'topology colors';
        speedLegendNote.textContent = [
          'Link colors show topology groups only.',
          'No speed scale is active.',
        ].join(' ');
        scale.style.background = [
          'linear-gradient(90deg',
          '#2563eb 0%',
          '#22c55e 20%',
          '#d946ef 40%',
          '#22d3ee 60%',
          '#ef4444 80%',
          '#facc15 100%)',
        ].join(', ');
        labels.innerHTML = [
          '<span style="left:0;transform:none">spine-spine</span>',
          '<span style="left:20%;transform:translateX(-50%)">leaf-spine</span>',
          '<span style="left:40%;transform:translateX(-50%)">exit-spine</span>',
          '<span style="left:60%;transform:translateX(-50%)">spine-exit</span>',
          '<span style="left:80%;transform:translateX(-50%)">leaf-exit</span>',
          '<span style="right:0">exit-exit</span>',
        ].join('');
        return;
        }
        speedControls.hidden = false;
        statusKey.hidden = false;
        speedLegendTitle.textContent = `speed colors: ${mode}`;
        speedLegendNote.textContent = [
        `Arrows and colors show ${mode} direction.`,
        'Amber means down. Cyan means the link is absent or no usable',
        'speed measurement was obtained.',
        'A filter minimum of 0 includes down and links absent / not measured.',
        ].join(' ');
        scale.style.background = [
        'linear-gradient(90deg',
        '#000004 0%',
        '#2c115f 18%',
        '#721f81 35%',
        '#b73779 52%',
        '#f1605d 68%',
        '#feb078 84%',
        '#fcfdbf 100%)',
        ].join(', ');
        labels.innerHTML = [
        '<span style="left:0;transform:none">0</span>',
        '<span style="left:30%;transform:translateX(-50%)">20</span>',
        '<span style="left:65%;transform:translateX(-50%)">100</span>',
        '<span style="right:0">500 Mbit/s</span>',
        ].join('');
        }

        function refreshEdges() {
        const active = activeGroups();
        const mode = document.getElementById('colorMode').value;
        for (const line of edgeObjects) {
        const edge = line.userData.edge;
        const inRange = metricInRange(edge, mode);
        line.visible = active.has(edge.group) && (inRange || !hideOutside.checked);
        line.material.color.set(colorFor(edge, mode));
        line.material.opacity = inRange ? 1 : 0.10;
        updateArrow(line, mode);
        }
        refreshSpeedLegend(mode);
        }

        if (DATA.topology_only) {
        const modeSelect = document.getElementById('colorMode');
        modeSelect.value = 'topology';
        modeSelect.querySelectorAll('option').forEach(option => {
          option.disabled = option.value !== 'topology';
        });
        }

        speedMin.addEventListener('input', () => updateSpeedRangeUi(speedMin));
        speedMax.addEventListener('input', () => updateSpeedRangeUi(speedMax));
        hideOutside.addEventListener('change', refreshEdges);
        document.getElementById('resetRange').addEventListener('click', () => {
        speedMin.value = '0';
        speedMax.value = '1000';
        updateSpeedRangeUi(null);
        });

        document.querySelectorAll('input[data-group]').forEach(input => {
        input.addEventListener('change', refreshEdges);
        });
        document.getElementById('colorMode').addEventListener('change', refreshEdges);

        addEventListener('mousemove', event => {
        mouse.x = event.clientX / innerWidth * 2 - 1;
        mouse.y = -(event.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(objects.filter(o => o.visible));
        if (!hits.length) {
        tooltip.style.display = 'none';
        return;
        }
        const obj = hits[0].object;
        if (obj.userData.type === 'node') {
        const n = obj.userData.node;
        tooltip.textContent = `${n.kind}:${n.name}\nlayer: ${n.layer}`;
        } else {
        tooltip.textContent = edgeTooltip(
          obj.userData.edge,
          document.getElementById('colorMode').value,
        );
        }
        tooltip.style.left = `${event.clientX + 14}px`;
        tooltip.style.top = `${event.clientY + 14}px`;
        tooltip.style.display = 'block';
        });

        addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        });

        function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        }
        updateSpeedRangeUi(null);
        refreshEdges();
        animate();
        </script>
    </body>
</html>
